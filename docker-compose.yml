services:
  db:
    image: mysql:8.4
    container_name: plusflix-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: plusflix
      MYSQL_USER: plusflix
      MYSQL_PASSWORD: plusflixpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -prootpass"]
      interval: 10s
      retries: 5
      timeout: 5s

  adminer:
    image: adminer:latest
    container_name: plusflix-adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
